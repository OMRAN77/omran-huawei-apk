name: Build Signed APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android-keystore
          echo "Decoded keystore sha256:"
          sha256sum android-keystore
          echo "Expected sha256: 42f92e25d79bf88e903152f07e01ee6fb5d754a6b75e5efd15aa0e87df498718"
          echo "Password length: ${#KEYSTORE_PASSWORD}"
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Verify keystore password with keytool
        run: |
          keytool -list -keystore android-keystore -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -alias omran-ai-builder || echo "KEYTOOL CHECK FAILED"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        env:
          KEYSTORE_PATH: ../android-keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: omran-ai-builder
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Build release AAB
        env:
          KEYSTORE_PATH: ../android-keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: omran-ai-builder
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: omran-ai-builder-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: omran-ai-builder-aab
          path: app/build/outputs/bundle/release/*.aab

      # v-release: نشر الملفين في صفحة Releases بروابط مباشرة —
      # تنزيل الـArtifacts يتطلب تسجيل دخول وفك ضغط، والمالك يحتاج
      # رابطًا مباشرًا لملف .aab يرفعه في Play Console.
      - name: Publish GitHub Release with binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.1-b4
          name: "v1.2.1 (versionCode 4, targetSdk 36)"
          body: "بناء موقّع جاهز للرفع في Play Console — app-release.aab للمتجر، app-release.apk للتثبيت اليدوي."
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
